guide: |
  ## Overview

  LLaVA-OneVision-Qwen2-0.5B-OV is a compact vision-language model based on
  Qwen2. It supports text generation, image understanding, multiple images,
  and visual conversation. The recipe uses the canonical Hugging Face
  checkpoint.

  ## vLLM-Ascend support

  The upstream tutorial validates single-NPU serving on an Atlas A2 with
  `quay.io/ascend/vllm-ascend:v0.23.0`. The documented launch uses TP1 and
  `--gpu-memory-utilization 0.8`. Prefill-decode disaggregation is listed as
  unsupported. This is upstream validation, not a local test by this project.

  ## References

  - [Hugging Face model card](https://huggingface.co/llava-hf/llava-onevision-qwen2-0.5b-ov-hf)
  - [vLLM-Ascend model tutorial](https://docs.vllm.ai/projects/ascend/zh-cn/latest/tutorials/models/LLaVA-OneVision-Qwen2-0.5B-OV.html)
