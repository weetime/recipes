meta:
  title: "Qwen3-Reranker-4B"
  slug: "qwen3-reranker-4b"
  provider: "Qwen"
  description: "4B dense text reranker for query-document relevance scoring, with documented vLLM-Ascend pooling support."
  date_added: 2026-10-21
  date_updated: 2026-10-25
  difficulty: intermediate
  tasks:
    - embedding
  hardware:
    ascend_910b: supported
    ascend_910c: supported
    ascend_950dt: supported
    ascend_950pr: supported

model:
  model_id: "Qwen/Qwen3-Reranker-4B"
  min_vllm_version: "0.9.2rc1"
  architecture: dense
  parameter_count: "4B"
  active_parameters: "4B"
  context_length: 32768
  base_args:
    - "--runner"
    - "pooling"
    - "--hf-overrides"
    - '{"architectures":["Qwen3ForSequenceClassification"],"classifier_from_token":["no","yes"],"is_original_qwen3_reranker":true}'
    - "--max-model-len"
    - "1024"
  base_env: {}

dependencies:
  - command: "pip install vllm-ascend"
    brand: Huawei
    note: "Upstream vLLM-Ascend documents the Qwen3-Reranker family on Atlas A2/A3 and Ascend 950DT/950PR. The catalog status is documented support, not local E2E verification."

features: {}
opt_in_features: []

variants:
  default:
    precision: bf16
    vram_minimum_gb: 10
    description: "BF16 pooling runner with the Qwen3 sequence-classification overrides and a 1,024-token model-length cap from the upstream tutorial."
    supported_hardware: [ascend_910b, ascend_910c, ascend_950dt, ascend_950pr]
    hardware_overrides:
      ascend_910b:
        docker_image: "quay.io/ascend/vllm-ascend:v0.23.0"
      ascend_910c:
        docker_image: "quay.io/ascend/vllm-ascend:v0.23.0-a3"
      ascend_950dt:
        docker_image: "quay.io/ascend/vllm-ascend:v0.23.0-a5"
      ascend_950pr:
        docker_image: "quay.io/ascend/vllm-ascend:v0.23.0-a5"

compatible_strategies:
  - single_node_tp

strategy_overrides:
  single_node_tp:
    tp: 1

hardware_overrides: {}

guide: |
  ## Overview

  `Qwen3-Reranker-4B` scores relevance for query/document pairs. It uses the pooling runner
  and `Qwen3ForSequenceClassification` overrides shown in the vLLM-Ascend
  tutorial. The service returns relevance scores from `/v1/rerank`. Upstream
  documents support for Atlas A2/A3 and Ascend 950DT/950PR; this recipe has not
  been locally E2E-tested on Ascend.

  ## Input formatting

  Follow the tutorial's query and document templates when preparing the rerank
  request. For Atlas 300I DUO, the tutorial specifically recommends keeping
  `--max-model-len` conservative (1,024) because attention-mask memory scales
  quadratically with the length.

  ## Runtime

  Use v0.23.0 for A2, v0.23.0-a3 for A3, and v0.23.0-a5 for 950DT/950PR. Verify
  host CANN and driver compatibility with the selected image.

  ## References

  - [Model card](https://huggingface.co/Qwen/Qwen3-Reranker-4B)
  - [vLLM-Ascend Qwen3-Reranker tutorial](https://docs.vllm.ai/projects/ascend/zh-cn/latest/tutorials/models/Qwen3-Reranker.html)
