meta:
  title: "Qwen3-VL-Reranker-8B"
  slug: "qwen3-vl-reranker-8b"
  provider: "Qwen"
  description: "8B multimodal reranker for text, image, screenshot, and video query-document relevance scoring."
  date_added: 2026-10-21
  date_updated: 2026-10-25
  difficulty: advanced
  tasks:
    - multimodal
    - embedding
  hardware:
    ascend_910b: supported
    ascend_910c: supported
    ascend_950dt: supported
    ascend_950pr: supported

model:
  model_id: "Qwen/Qwen3-VL-Reranker-8B"
  min_vllm_version: "0.9.2rc1"
  architecture: dense
  parameter_count: "8B"
  active_parameters: "8B"
  context_length: 32768
  base_args:
    - "--runner"
    - "pooling"
    - "--hf-overrides"
    - '{"architectures":["Qwen3VLForSequenceClassification"],"classifier_from_token":["no","yes"],"is_original_qwen3_reranker":true}'
    - "--chat-template"
    - "./qwen3_vl_reranker.jinja"
    - "--max-model-len"
    - "1024"
  base_env: {}

dependencies:
  - command: "pip install vllm-ascend"
    brand: Huawei
    note: "Upstream vLLM-Ascend documents the Qwen3-VL-Reranker family on Atlas A2/A3 and Ascend 950DT/950PR. The catalog status is documented support, not local E2E verification."

features: {}
opt_in_features: []

variants:
  default:
    precision: bf16
    vram_minimum_gb: 22
    description: "BF16 multimodal pooling runner with the sequence-classification overrides and custom Qwen reranker chat template."
    supported_hardware: [ascend_910b, ascend_910c, ascend_950dt, ascend_950pr]
    hardware_overrides:
      ascend_910b:
        docker_image: "quay.io/ascend/vllm-ascend:v0.23.0"
      ascend_910c:
        docker_image: "quay.io/ascend/vllm-ascend:v0.23.0-a3"
      ascend_950dt:
        docker_image: "quay.io/ascend/vllm-ascend:v0.23.0-a5"
      ascend_950pr:
        docker_image: "quay.io/ascend/vllm-ascend:v0.23.0-a5"

compatible_strategies:
  - single_node_tp

strategy_overrides:
  single_node_tp:
    tp: 1

hardware_overrides: {}

guide: |
  ## Overview

  `Qwen3-VL-Reranker-8B` is a multimodal reranker for text, image, screenshot, and video
  query-document pairs. It uses the pooling runner, Qwen3-VL sequence
  classification overrides, and a custom chat template. The upstream tutorial
  documents support on Atlas A2/A3 and Ascend 950DT/950PR; this recipe has not
  been locally E2E-tested on Ascend.

  ## Required chat template

  The launch command expects `qwen3_vl_reranker.jinja` in the current directory.
  Download it from the [recipe template file](https://raw.githubusercontent.com/vllm-project/recipes/main/models/Qwen/templates/qwen3_vl_reranker.jinja)
  before starting the server. Keep `--max-model-len 1024` for the conservative
  documented setting; the tutorial warns that attention-mask memory grows
  quadratically with model length, especially on Atlas 300I DUO.

  ## Runtime

  Use v0.23.0 for A2, v0.23.0-a3 for A3, and v0.23.0-a5 for 950DT/950PR.
  Confirm host CANN and driver compatibility with the selected image.

  ## References

  - [Model card](https://huggingface.co/Qwen/Qwen3-VL-Reranker-8B)
  - [vLLM-Ascend Qwen3-VL-Reranker tutorial](https://docs.vllm.ai/projects/ascend/zh-cn/latest/tutorials/models/Qwen3-VL-Reranker.html)
