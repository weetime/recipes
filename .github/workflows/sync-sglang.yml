name: Sync SGLang blocks (cookbook configs)

# Weekly (+ on-demand) re-vendor of the SGLang cookbook's declarative configs
# (sgl-project/sglang · docs_new/src/snippets/configs) and regeneration of
# engines/sglang/ blocks. Purely mechanical — if anything changed it validates
# and opens a PR. Authoring guides for any newly-covered models
# (engines/sglang-guides/) is the intelligent follow-up: ping Claude on the PR.
# (Fork-local engines/sglang-overlay/ blocks — e.g. the DeepSeek-V4-Flash PPU
# config — are never touched by the sync.)

on:
  schedule:
    - cron: "17 6 * * 1"     # weekly · Monday 06:17 UTC (offset minute)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

env:
  SYNC_BRANCH: sync/sglang

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure bot identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Re-vendor latest cookbook configs + regenerate blocks
        run: |
          node scripts/fetch-sglang-configs.mjs main   # 'main' = latest, not the pinned ref
          node scripts/sync-sglang.mjs

      - name: Anything changed?
        id: diff
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Cookbook configs unchanged since the pinned snapshot — nothing to sync." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild API + rebaseline golden + test
        if: steps.diff.outputs.changed == 'true'
        run: |
          node scripts/build-recipes-api.mjs
          node scripts/snapshot-api.mjs --write
          node --test

      - name: Commit + open/update PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout -B "$SYNC_BRANCH"
          git add -A
          git commit -s -m "Sync SGLang blocks from the cookbook configs ($(date -u +%Y-%m-%d))"
          git push origin "$SYNC_BRANCH" --force-with-lease
          {
            echo "Automated re-vendor of the SGLang cookbook's declarative configs (\`sgl-project/sglang · docs_new/src/snippets/configs\`) + regenerated \`engines/sglang/\` blocks."
            echo
            echo "Review the new/changed generated blocks. **Newly-covered models may want a hand-authored guide** (\`engines/sglang-guides/\`) — ping Claude to finish those, then merge. Fork-local \`engines/sglang-overlay/\` blocks are untouched."
          } > pr-body.md
          if gh pr view "$SYNC_BRANCH" >/dev/null 2>&1; then
            gh pr edit "$SYNC_BRANCH" --body-file pr-body.md
          else
            gh pr create --base main --head "$SYNC_BRANCH" \
              --title "Sync SGLang blocks from cookbook configs ($(date -u +%Y-%m-%d))" \
              --body-file pr-body.md
          fi
