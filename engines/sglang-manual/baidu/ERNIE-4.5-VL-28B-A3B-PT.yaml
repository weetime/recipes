# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry ERNIE-4.5-VL-28B-A3B-PT yet. See engines/sglang-manual/README.md.
# Sources: issue #13 (web-verified 2026-06-11) — VLM via native ernie45_vl.py.
# #13 records no SGLang tool/reasoning parser for ERNIE VL — left empty.
engine: sglang
model_id: baidu/ERNIE-4.5-VL-28B-A3B-PT
min_version: v0.5.6
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  mi300x: 1
  mi325x: 1
  mi355x: 1
variants:
  default:
    precision: bf16
strategies:
  single_node_tp: {}
features: {}
