# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry gemma-4-12B-it yet. See engines/sglang-manual/README.md.
# Sources: SGLang Gemma 4 docs (mirrors the generated gemma-4-31B-it block) —
# unified multimodal dense model; parsers gemma4 (tool) / gemma4 (reasoning).
# Recipe verifies h100 only; 12B BF16 (~26 GB) fits one H100 at tp 1.
engine: sglang
model_id: google/gemma-4-12B-it
min_version: v0.5.10
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h100: 1
variants:
  default:
    precision: bf16
strategies:
  single_node_tp: {}
features:
  tool_calling:
    args:
      - '--tool-call-parser'
      - gemma4
  reasoning:
    args:
      - '--reasoning-parser'
      - gemma4
