# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry DiffusionGemma yet. See engines/sglang-manual/README.md.
# Sources: SGLang supported diffusion-LM docs + cookbook (google/diffusiongemma-26B-A4B-it,
# served via the standard launch_server with --dllm-algorithm Gemma4Renoise);
# DiffusionGemma HF card (SGLang serve instructions, --trust-remote-code required).
# NOTE: this is the text-diffusion LLM path (like SDAR / LLaDA2), NOT SGLang-Diffusion.
engine: sglang
model_id: google/diffusiongemma-26B-A4B-it
min_version: v0.5.6
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
  - '--dllm-algorithm'
  - Gemma4Renoise
tp_by_hardware:
  h200: 1
variants:
  default:
    precision: bf16
strategies:
  single_node_tp: {}
features: {}
