# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry translategemma-27b-it yet. See engines/sglang-manual/README.md.
# Sources: issue #13 (web-verified 2026-06-11) — Gemma3 arch via gemma3_mm.py.
# Translation model — no chat tool/reasoning parser applies.
engine: sglang
model_id: google/translategemma-27b-it
min_version: v0.5.6
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h200: 1
variants:
  default:
    precision: bf16
strategies:
  single_node_tp: {}
features: {}
