# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16 yet. See
# engines/sglang-manual/README.md.
# Sources: HF model card + vLLM recipe. Hybrid Transformer-Mamba MoE, 550B total
# / 55B active, BF16. SGLang reasoning parser `nemotron_3`; the recipe confirms a
# Qwen3-Coder tool-call protocol → SGLang `qwen3_coder`. BF16 weights (~1.2 TB)
# need tp 8 (renderer derives multi-node). Recipe verifies b200 → b200: 8 only.
engine: sglang
model_id: nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
min_version: v0.5.10
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  b200: 8
variants:
  default:
    precision: bf16
strategies:
  single_node_tp: {}
features:
  tool_calling:
    args:
      - '--tool-call-parser'
      - qwen3_coder
  reasoning:
    args:
      - '--reasoning-parser'
      - nemotron_3
