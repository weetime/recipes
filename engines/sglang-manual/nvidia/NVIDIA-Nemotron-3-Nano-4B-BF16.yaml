# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry this model yet. See engines/sglang-manual/README.md.
# Sources: HF model card + repo issue #13 (web-verified 2026-06-11).
# Hybrid-Mamba dense 4B. SGLang reasoning parser is `nemotron_3` (the card's
# `nano_v3` is vLLM's name). No confirmed SGLang tool parser → tool_calling
# omitted. Hybrid-Mamba may need mamba-ssm / --max-mamba-cache-size (see guide).
engine: sglang
model_id: nvidia/NVIDIA-Nemotron-3-Nano-4B-BF16
min_version: v0.5.10
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h200: 1
  b200: 1
variants:
  default:
    precision: bf16
strategies:
  single_node_tp: {}
features:
  reasoning:
    args:
      - '--reasoning-parser'
      - nemotron_3
