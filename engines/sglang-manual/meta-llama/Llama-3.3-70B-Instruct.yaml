# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry this model yet. See engines/sglang-manual/README.md.
# Sources: SGLang core model (Llama arch), issue #13 (web-verified 2026-06-11):
#   core support; --tool-call-parser llama3_json. Llama needs no --trust-remote-code.
# tp: bf16 70B ≈ 154 GB → h200(141 GB/GPU) tp 2, b200(180)/gb200(192) tp 1.
engine: sglang
model_id: meta-llama/Llama-3.3-70B-Instruct
min_version: v0.5.6
serve_binary: python3 -m sglang.launch_server
base_args: []
tp_by_hardware:
  h100: 2
  h200: 2
  b200: 1
  gb200: 1
variants:
  default:
    precision: bf16
strategies:
  single_node_tp: {}
features:
  tool_calling:
    args:
      - '--tool-call-parser'
      - llama3_json
