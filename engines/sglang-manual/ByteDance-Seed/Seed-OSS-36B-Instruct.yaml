# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry Seed-OSS-36B-Instruct yet. See engines/sglang-manual/README.md.
# Sources: issue #13 (web-verified, 2026-06-11) — runs via SGLang's HF
# transformers fallback (no native impl; native PR #9448 open). No confirmed
# SGLang reasoning/tool parser id yet, so features are left empty; the model
# emits <seed:think> blocks (see guide).
engine: sglang
model_id: ByteDance-Seed/Seed-OSS-36B-Instruct
min_version: v0.5.6
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h200: 1
variants:
  default:
    precision: bf16
strategies:
  single_node_tp: {}
features: {}
