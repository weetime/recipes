# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry Laguna-XS.2 yet. See engines/sglang-manual/README.md.
# Sources: issue #13 (web-verified, 2026-06-11) — native laguna.py; tool +
# reasoning parser `poolside_v1`.
engine: sglang
model_id: poolside/Laguna-XS.2
min_version: v0.5.6
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h200: 1
variants:
  default:
    precision: bf16
strategies:
  single_node_tp: {}
features:
  tool_calling:
    args:
      - '--tool-call-parser'
      - poolside_v1
  reasoning:
    args:
      - '--reasoning-parser'
      - poolside_v1
