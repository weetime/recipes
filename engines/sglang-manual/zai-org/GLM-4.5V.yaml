# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry GLM-4.5V yet. See engines/sglang-manual/README.md.
# Sources: issue #13 (web-verified 2026-06-11) — VLM via native glm4v_moe.py, parsers `glm45`.
engine: sglang
model_id: zai-org/GLM-4.5V
min_version: v0.5.6
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h100: 8
  h200: 8
variants:
  default:
    precision: bf16
strategies:
  single_node_tp: {}
features:
  tool_calling:
    args:
      - '--tool-call-parser'
      - glm45
  reasoning:
    args:
      - '--reasoning-parser'
      - glm45
