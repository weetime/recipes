# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry Glyph yet. See engines/sglang-manual/README.md.
# Sources: issue #13 (web-verified 2026-06-11) — VLM (GLM-4V) via native glm4v.py.
# Reasoning parser mirrors the GLM-4.5 family (`glm45`); verify against the
# running SGLang build.
engine: sglang
model_id: zai-org/Glyph
min_version: v0.5.6
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h100: 1
  mi300x: 1
  mi325x: 1
variants:
  default:
    precision: bf16
strategies:
  single_node_tp: {}
features:
  reasoning:
    args:
      - '--reasoning-parser'
      - glm45
