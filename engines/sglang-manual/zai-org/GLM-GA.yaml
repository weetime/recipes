# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry GLM-GA yet. See engines/sglang-manual/README.md.
# Sources: GLM-GA HF card (Glm4vForConditionalGeneration, same class as GLM-4.6V);
# SGLang tracking issue #18458 (Glm4vForConditionalGeneration: Native Y, glm4v.py);
# SGLang GLM-4.5/4.6 docs (reasoning/tool parser = glm45).
engine: sglang
model_id: zai-org/GLM-GA
min_version: v0.5.6
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h200: 1
  b200: 1
variants:
  default:
    precision: bf16
strategies:
  single_node_tp: {}
features:
  tool_calling:
    args:
      - '--tool-call-parser'
      - glm45
  reasoning:
    args:
      - '--reasoning-parser'
      - glm45
