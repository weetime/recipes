# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry MiniCPM-V-4.6 yet. See engines/sglang-manual/README.md.
# Sources: issue #13 (web-verified, 2026-06-11) — VLM served via native
# minicpmv.py; tool parser `qwen3_coder`, reasoning parser `qwen3`.
engine: sglang
model_id: openbmb/MiniCPM-V-4.6
min_version: v0.5.6
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h200: 1
variants:
  default:
    precision: bf16
strategies:
  single_node_tp: {}
features:
  tool_calling:
    args:
      - '--tool-call-parser'
      - qwen3_coder
  reasoning:
    args:
      - '--reasoning-parser'
      - qwen3
