# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry MiniCPM5-1B yet. See engines/sglang-manual/README.md.
# Sources: issue #13 (web-verified, 2026-06-11) — SGLang ships the `minicpm5`
# tool-call parser built-in.
engine: sglang
model_id: openbmb/MiniCPM5-1B
min_version: v0.5.6
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h200: 1
variants:
  default:
    precision: bf16
strategies:
  single_node_tp: {}
features:
  tool_calling:
    args:
      - '--tool-call-parser'
      - minicpm5
