# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry MiniMax-M2 yet. See engines/sglang-manual/README.md.
# Sources: issue #13 (web-verified 2026-06-11) — sglang>=0.5.4.post3,
# --tool-call-parser minimax-m2 --reasoning-parser minimax-append-think.
engine: sglang
model_id: MiniMaxAI/MiniMax-M2
min_version: v0.5.4.post3
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h100: 4
  h200: 2
  mi300x: 2
  mi325x: 2
variants:
  default:
    precision: fp8
strategies:
  single_node_tp: {}
features:
  tool_calling:
    args:
      - '--tool-call-parser'
      - minimax-m2
  reasoning:
    args:
      - '--reasoning-parser'
      - minimax-append-think
