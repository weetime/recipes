# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry DeepSeek-OCR-2 yet. See engines/sglang-manual/README.md.
# Issue #13: VLM; ⚠ open accuracy bug #18358. No tool/reasoning parser → features: {}.
engine: sglang
model_id: deepseek-ai/DeepSeek-OCR-2
min_version: v0.5.6
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h200: 1
  b200: 1
variants:
  default:
    precision: bf16
strategies:
  single_node_tp: {}
features: {}
