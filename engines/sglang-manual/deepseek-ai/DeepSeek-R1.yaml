# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry DeepSeek-R1 yet. See engines/sglang-manual/README.md.
# Sources: SGLang DeepSeek docs (deepseek_v3.md) — R1 supported, MLA + MTP.
engine: sglang
model_id: deepseek-ai/DeepSeek-R1
min_version: v0.5.6
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h200: 8
  b200: 8
variants:
  default:
    precision: fp8
strategies:
  single_node_tp: {}
features:
  tool_calling:
    args:
      - '--tool-call-parser'
      - deepseekv3
  reasoning:
    args:
      - '--reasoning-parser'
      - deepseek-r1
