# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry DeepSeek-V3 yet. See engines/sglang-manual/README.md.
# Sources: SGLang DeepSeek docs (deepseek_v3.md) — V3 supported, MLA + MTP.
# Issue #13: --tool-call-parser deepseekv3 (base V3 is non-reasoning → tool only).
engine: sglang
model_id: deepseek-ai/DeepSeek-V3
min_version: v0.5.6
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h200: 8
  b200: 8
variants:
  default:
    precision: fp8
strategies:
  single_node_tp: {}
features:
  tool_calling:
    args:
      - '--tool-call-parser'
      - deepseekv3
