# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry DeepSeek-V3.1 yet. See engines/sglang-manual/README.md.
# Sources: SGLang DeepSeek docs (deepseek_v3.md) — V3.1 hybrid thinking/non-thinking.
# Issue #13: --tool-call-parser deepseekv31; reasoning via --reasoning-parser deepseek-v3
# (mirrors engines/sglang/deepseek-ai/DeepSeek-V3.2.yaml).
engine: sglang
model_id: deepseek-ai/DeepSeek-V3.1
min_version: v0.5.6
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h200: 8
variants:
  default:
    precision: fp8
strategies:
  single_node_tp: {}
features:
  tool_calling:
    args:
      - '--tool-call-parser'
      - deepseekv31
  reasoning:
    args:
      - '--reasoning-parser'
      - deepseek-v3
