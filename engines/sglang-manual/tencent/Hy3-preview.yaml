# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry Hy3-preview yet. See engines/sglang-manual/README.md.
# Sources: issue #13 (web-verified 2026-06-11) — native hunyuan_v3.py (+ MTP).
# #13 does not record SGLang tool/reasoning parser names for Hy3 — left empty
# rather than copy vLLM's `hy_v3`; verify against the running build before adding.
engine: sglang
model_id: tencent/Hy3-preview
min_version: v0.5.6
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h200: 8
  mi300x: 8
  mi325x: 8
  mi350x: 8
  mi355x: 8
variants:
  default:
    precision: bf16
strategies:
  single_node_tp: {}
features: {}
