# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry MiMo-V2-Flash yet. See engines/sglang-manual/README.md.
# Sources: issue #13 (web-verified 2026-06-11) —
# --tool-call-parser mimo --reasoning-parser qwen3; nightly at launch, so a
# recent SGLang release is required (>=0.5.10).
engine: sglang
model_id: XiaomiMiMo/MiMo-V2-Flash
min_version: v0.5.10
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h200: 4
  mi300x: 2
  mi325x: 2
variants:
  default:
    precision: fp8
strategies:
  single_node_tp: {}
features:
  tool_calling:
    args:
      - '--tool-call-parser'
      - mimo
  reasoning:
    args:
      - '--reasoning-parser'
      - qwen3
