# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry this model yet. See engines/sglang-manual/README.md.
# Sources: SGLang mistral3 (VLM) arch, issue #13 (web-verified 2026-06-11):
#   --tool-call-parser mistral. Instruct (not Reasoning) → no reasoning parser.
#   --trust-remote-code kept (Ministral-3 custom mistral3 arch).
# tp: fp8 14B ≈ 15 GB → tp 1 on h200 / mi300x.
engine: sglang
model_id: mistralai/Ministral-3-14B-Instruct-2512
min_version: v0.5.6
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h200: 1
  mi300x: 1
variants:
  default:
    precision: fp8
strategies:
  single_node_tp: {}
features:
  tool_calling:
    args:
      - '--tool-call-parser'
      - mistral
