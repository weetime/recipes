# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry this model yet. See engines/sglang-manual/README.md.
# Sources: SGLang dedicated mistral_large_3.py, issue #13 (web-verified 2026-06-11):
#   --tool-call-parser mistral --reasoning-parser mistral; NVFP4 on Blackwell.
#   --trust-remote-code kept (custom mistral_large_3 arch).
# tp: fp8 675B ≈ 742 GB → tp 8. Single-node fits an 8×B200 node (1440 GB);
#   8×H200 (1128 GB) also fits the fp8 weights. See guide for H200 note.
engine: sglang
model_id: mistralai/Mistral-Large-3-675B-Instruct-2512
min_version: v0.5.6
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  b200: 8
variants:
  default:
    precision: fp8
strategies:
  single_node_tp: {}
features:
  tool_calling:
    args:
      - '--tool-call-parser'
      - mistral
  reasoning:
    args:
      - '--reasoning-parser'
      - mistral
