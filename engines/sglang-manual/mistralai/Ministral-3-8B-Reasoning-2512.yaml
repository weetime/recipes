# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry this model yet. See engines/sglang-manual/README.md.
# Sources: SGLang mistral3 (VLM) arch, issue #13 (web-verified 2026-06-11):
#   --tool-call-parser mistral, --reasoning-parser mistral (thinking variant).
#   --trust-remote-code kept (Ministral-3 custom mistral3 arch).
# tp: bf16 8B ≈ 18 GB → tp 1 on h200 / gb200 / mi300x.
engine: sglang
model_id: mistralai/Ministral-3-8B-Reasoning-2512
min_version: v0.5.6
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h200: 1
  gb200: 1
  mi300x: 1
variants:
  default:
    precision: bf16
strategies:
  single_node_tp: {}
features:
  tool_calling:
    args:
      - '--tool-call-parser'
      - mistral
  reasoning:
    args:
      - '--reasoning-parser'
      - mistral
