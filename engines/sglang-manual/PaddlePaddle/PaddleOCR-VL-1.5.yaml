# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry PaddleOCR-VL-1.5 yet. See engines/sglang-manual/README.md.
# Sources: issue #13 (web-verified, 2026-06-11) — same arch as v1.0; VLM/OCR
# via native paddleocr_vl.py. No tool/reasoning parsers, so features empty.
engine: sglang
model_id: PaddlePaddle/PaddleOCR-VL-1.5
min_version: v0.5.6
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h200: 1
variants:
  default:
    precision: bf16
strategies:
  single_node_tp: {}
features: {}
