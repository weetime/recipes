# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry Qwen3.5-9B yet. See engines/sglang-manual/README.md.
# Sources: issue #13 — Qwen3.5 family needs the SGLang main branch (track as
# v0.5.11); parsers qwen3 (tool/reasoning). VLM → --trust-remote-code.
engine: sglang
model_id: Qwen/Qwen3.5-9B
min_version: v0.5.11
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h200: 1
  b200: 1
variants:
  default:
    precision: bf16
strategies:
  single_node_tp: {}
features:
  tool_calling:
    args:
      - '--tool-call-parser'
      - qwen3_coder
  reasoning:
    args:
      - '--reasoning-parser'
      - qwen3
