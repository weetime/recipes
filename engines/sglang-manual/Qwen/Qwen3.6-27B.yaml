# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry Qwen3.6-27B yet. See engines/sglang-manual/README.md.
# Sources: issue #13 — sglang>=0.5.10; reasoning parser qwen3; MTP (NEXTN).
# VLM → --trust-remote-code.
engine: sglang
model_id: Qwen/Qwen3.6-27B
min_version: v0.5.10
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h200: 1
  b200: 1
variants:
  default:
    precision: bf16
strategies:
  single_node_tp: {}
features:
  tool_calling:
    args:
      - '--tool-call-parser'
      - qwen3_coder
  reasoning:
    args:
      - '--reasoning-parser'
      - qwen3
