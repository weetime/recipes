# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry Qwen3-32B yet. See engines/sglang-manual/README.md.
# Sources: SGLang Qwen3 docs — dense Qwen3 with thinking mode; parsers
# qwen3_coder (tool) / qwen3 (reasoning). Recipe lists only TPU hardware
# (trillium, ironwood) → default to h200 + b200 for our taxonomy.
engine: sglang
model_id: Qwen/Qwen3-32B
min_version: v0.5.6
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h200: 1
  b200: 1
variants:
  default:
    precision: bf16
strategies:
  single_node_tp: {}
features:
  tool_calling:
    args:
      - '--tool-call-parser'
      - qwen3_coder
  reasoning:
    args:
      - '--reasoning-parser'
      - qwen3
