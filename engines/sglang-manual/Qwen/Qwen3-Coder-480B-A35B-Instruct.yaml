# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry Qwen3-Coder-480B-A35B-Instruct yet. See engines/sglang-manual/README.md.
# Sources: SGLang docs + issue #13 — MoE (480B/35B) served via launch_server;
# Qwen3 Coder tool parser `qwen3_coder`; expert parallel recommended.
engine: sglang
model_id: Qwen/Qwen3-Coder-480B-A35B-Instruct
min_version: v0.5.6
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h200: 8
  b200: 8
variants:
  default:
    precision: bf16
strategies:
  single_node_tp: {}
features:
  tool_calling:
    args:
      - '--tool-call-parser'
      - qwen3_coder
