# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry Qwen2.5-VL-7B-Instruct yet. See engines/sglang-manual/README.md.
# Sources: SGLang multimodal docs — VLM via launch_server, served with
# --chat-template qwen2-vl. Tool parser is the Qwen family `qwen`. Recipe lists
# only TPU hardware (trillium) → default to h200 + b200 for our taxonomy.
engine: sglang
model_id: Qwen/Qwen2.5-VL-7B-Instruct
min_version: v0.5.6
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h200: 1
  b200: 1
variants:
  default:
    precision: bf16
strategies:
  single_node_tp: {}
features:
  tool_calling:
    args:
      - '--tool-call-parser'
      - qwen
