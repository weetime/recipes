# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry Qwen2.5-VL-72B-Instruct yet. See engines/sglang-manual/README.md.
# Sources: SGLang multimodal docs + issue #13 — VLM via launch_server,
# served with --chat-template qwen2-vl. Tool parser is the Qwen family `qwen`.
engine: sglang
model_id: Qwen/Qwen2.5-VL-72B-Instruct
min_version: v0.5.6
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h200: 2
  b200: 1
variants:
  default:
    precision: bf16
strategies:
  single_node_tp: {}
features:
  tool_calling:
    args:
      - '--tool-call-parser'
      - qwen
