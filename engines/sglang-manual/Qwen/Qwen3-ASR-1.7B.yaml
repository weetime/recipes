# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry Qwen3-ASR-1.7B yet. See engines/sglang-manual/README.md.
# Sources: SGLang docs + issue #13 — audio→text model served via the
# /v1/audio/transcriptions endpoint. No chat tool/reasoning parsers apply.
engine: sglang
model_id: Qwen/Qwen3-ASR-1.7B
min_version: v0.5.6
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h200: 1
  b200: 1
variants:
  default:
    precision: bf16
strategies:
  single_node_tp: {}
features: {}
