# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry Step-3.7-Flash yet. See engines/sglang-manual/README.md.
# Sources: issue #13 (web-verified, 2026-06-11) — VLM MoE via native
# step3p7.py. #13 gives no SGLang parser ids, so features are left empty.
engine: sglang
model_id: stepfun-ai/Step-3.7-Flash
min_version: v0.5.6
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h200: 4
  b200: 4
variants:
  default:
    precision: bf16
strategies:
  single_node_tp: {}
features: {}
