# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry InternVL3_5-8B yet. See engines/sglang-manual/README.md.
# Sources: issue #13 (web-verified 2026-06-11) — VLM via native internvl.py.
# No chat tool/reasoning parser applies.
engine: sglang
model_id: OpenGVLab/InternVL3_5-8B
min_version: v0.5.6
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h100: 1
  mi300x: 1
  mi325x: 1
  mi355x: 1
variants:
  default:
    precision: bf16
strategies:
  single_node_tp: {}
features: {}
