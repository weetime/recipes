# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry this model yet. See engines/sglang-manual/README.md.
# Sources: SGLang native phi.py (Phi3ForCausalLM), issue #13 (web-verified 2026-06-11).
#   No dedicated tool/reasoning parser on the card → features omitted.
#   --trust-remote-code kept (Phi ships custom config/modeling).
engine: sglang
model_id: microsoft/Phi-4-mini-instruct
min_version: v0.5.6
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h100: 1
variants:
  default:
    precision: bf16
strategies:
  single_node_tp: {}
features: {}
