# HAND-AUTHORED SGLang block (engines/sglang-manual/) — upstream sgl-cookbook
# doesn't carry Intern-S2-Preview yet. See engines/sglang-manual/README.md.
# Sources: issue #13 (web-verified 2026-06-11) — VLM via native interns2preview.py.
# #13 records no SGLang tool/reasoning parser for Intern-S2 — left empty (the
# vLLM recipe borrows qwen3/qwen3_coder, unverified for SGLang).
engine: sglang
model_id: internlm/Intern-S2-Preview
min_version: v0.5.6
serve_binary: python3 -m sglang.launch_server
base_args:
  - '--trust-remote-code'
tp_by_hardware:
  h200: 1
  gb200: 1
variants:
  default:
    precision: bf16
strategies:
  single_node_tp: {}
features: {}
